name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.88.0 fmt --all -- --check
      - name: Test
        run: cargo +1.88.0 test --all-targets --locked
      - name: Lint
        run: cargo +1.88.0 clippy --all-targets --locked -- -D warnings
