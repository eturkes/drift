[package]
name = "drift-observer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Evidence-grounded task-drift observability for agent sessions"
license = "Apache-2.0 WITH LLVM-exception"

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
proptest = "1.11.0"

[profile.release]
lto = "thin"
strip = true
