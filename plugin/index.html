<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #dce8e7;
        --muted: #829391;
        --void: #08100f;
        --panel: #0d1817;
        --line: #233532;
        --signal: #62dfbc;
        --signal-soft: rgb(98 223 188 / 9%);
        --amber: #e7bb63;
        --danger: #f17c73;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        background: var(--void);
        color: var(--ink);
      }

      :root[data-mode="light"] {
        color-scheme: light;
        --ink: #172522;
        --muted: #5f716d;
        --void: #edf4f1;
        --panel: #f9fcfa;
        --line: #bacdc7;
        --signal: #087b5e;
        --signal-soft: rgb(8 123 94 / 7%);
        --amber: #8a5c08;
        --danger: #a73b35;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(var(--signal-soft) 1px, transparent 1px),
          linear-gradient(90deg, var(--signal-soft) 1px, transparent 1px), var(--void);
        background-size: 38px 38px;
      }

      main {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 32px clamp(16px, 4vw, 52px) 64px;
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 24px;
        margin-bottom: 24px;
      }

      .kicker,
      .project,
      .path,
      .count,
      label,
      select,
      button,
      pre,
      .empty code {
        font-family: ui-monospace, "Cascadia Code", monospace;
      }

      .kicker {
        margin: 0 0 7px;
        color: var(--signal);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 7vw, 70px);
        font-weight: 600;
        line-height: 0.92;
        letter-spacing: -0.055em;
      }

      .project {
        max-width: 360px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .console {
        overflow: hidden;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel), transparent 5%);
        box-shadow: 0 22px 80px rgb(0 0 0 / 18%);
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: end;
        gap: 10px;
        padding: 15px;
        border-bottom: 1px solid var(--line);
      }

      .field {
        min-width: 0;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      select,
      button {
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--void);
        color: var(--ink);
        font-size: 11px;
      }

      select {
        width: 100%;
        padding: 0 10px;
      }

      button {
        min-width: 86px;
        padding: 0 14px;
        cursor: pointer;
      }

      button.primary {
        border-color: color-mix(in srgb, var(--signal), transparent 40%);
        background: var(--signal-soft);
        color: var(--signal);
      }

      button:hover:not(:disabled) {
        border-color: var(--signal);
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .report-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        padding: 0 15px;
        border-bottom: 1px solid var(--line);
      }

      .path {
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .count {
        flex: 0 0 auto;
        color: var(--signal);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      pre {
        min-height: 420px;
        max-height: 72vh;
        margin: 0;
        padding: clamp(16px, 3vw, 30px);
        overflow: auto;
        color: var(--ink);
        font-size: 12px;
        line-height: 1.62;
        tab-size: 2;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      pre[data-state="loading"] {
        color: var(--muted);
      }

      pre[data-state="error"] {
        color: var(--danger);
      }

      .empty {
        display: grid;
        align-content: center;
        min-height: 420px;
        padding: clamp(20px, 5vw, 54px);
      }

      .empty strong {
        font-size: 26px;
        font-weight: 500;
      }

      .empty p {
        max-width: 650px;
        color: var(--muted);
        line-height: 1.6;
      }

      .empty code {
        display: block;
        max-width: 720px;
        padding: 12px;
        border: 1px solid var(--line);
        background: var(--void);
        color: var(--amber);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 70vh;
        color: var(--muted);
      }

      .sweep {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: conic-gradient(from 0deg, var(--signal), transparent 24%);
        animation: sweep 1.3s linear infinite;
      }

      @keyframes sweep {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 660px) {
        main {
          padding-top: 22px;
        }

        header,
        .toolbar {
          grid-template-columns: 1fr;
        }

        .project {
          text-align: left;
        }

        button {
          width: 100%;
        }

        pre {
          max-height: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sweep {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="loading" role="status"><span class="sweep" aria-hidden="true"></span>Scanning for Drift reports…</div>
    </main>
    <script type="module">
      const API_VERSION = "1.0";
      const REQUIRED = ["project.tree", "drift.render"];
      const MAX_RENDERED_CHARS = 1_048_576;
      const app = document.querySelector("#app");
      const pending = new Map();
      let port;
      let context;
      let renderGeneration = 0;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function call(method, params) {
        if (!port) return Promise.reject(new Error("Plugin channel is unavailable"));
        const id = crypto.randomUUID();
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            pending.delete(id);
            reject(new Error(`${method} timed out`));
          }, 15_000);
          pending.set(id, { resolve, reject, timeout });
          port.postMessage({ kind: "request", id, method, params });
        });
      }

      function candidateRank(path) {
        const lower = path.toLowerCase();
        if (!lower.endsWith(".json")) return -1;
        const basename = lower.split("/").at(-1) || "";
        let score = 0;
        if (lower.startsWith(".drift/")) score += 100;
        if (basename.endsWith(".drift.json")) score += 80;
        if (basename.includes("drift")) score += 40;
        if (basename.includes("report")) score += 20;
        if (lower.includes("/reports/")) score += 10;
        return score || -1;
      }

      function reportCandidates(value) {
        if (!Array.isArray(value)) throw new Error("project.tree result is not an array");
        return value
          .map((entry) => {
            if (!entry || typeof entry !== "object") {
              throw new Error("project.tree contains an invalid entry");
            }
            if (typeof entry.path !== "string" || entry.path.length < 1 || entry.path.length > 1024) {
              throw new Error("project.tree contains an invalid path");
            }
            return { path: entry.path, kind: entry.kind, rank: candidateRank(entry.path) };
          })
          .filter((entry) => entry.kind === "file" && entry.rank >= 0)
          .sort((left, right) => right.rank - left.rank || (left.path < right.path ? -1 : left.path > right.path ? 1 : 0));
      }

      function renderedReport(value, expectedPath) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new Error("drift.render result is not an object");
        }
        if (value.path !== expectedPath) throw new Error("drift.render returned a different path");
        if (
          typeof value.text !== "string" ||
          value.text.length < 1 ||
          value.text.length > MAX_RENDERED_CHARS
        ) {
          throw new Error("drift.render returned invalid or oversized text");
        }
        return { path: value.path, text: value.text };
      }

      function decision(text) {
        return /^(KEEP|RERUN|INSPECT|UNKNOWN)\b/.exec(text)?.[1] || "REPORT";
      }

      function setPluginStatus(state, badge, title) {
        port.postMessage({
          kind: "event",
          name: "status",
          payload: { state, badge, title: title.slice(0, 80) },
        });
      }

      async function loadReport(path) {
        const generation = ++renderGeneration;
        const output = document.querySelector("#report-output");
        const pathLabel = document.querySelector("#report-path");
        const button = document.querySelector("#render-report");
        const select = document.querySelector("#report-select");
        const refresh = document.querySelector("#refresh-reports");
        output.dataset.state = "loading";
        output.textContent = "Validating and rendering native Drift report…";
        pathLabel.textContent = path;
        button.disabled = true;
        select.disabled = true;
        refresh.disabled = true;
        setPluginStatus("busy", null, `Drift · ${context.project.name}`);
        try {
          const report = renderedReport(await call("drift.render", { path }), path);
          if (generation !== renderGeneration) return;
          output.dataset.state = "ready";
          output.textContent = report.text;
          const verdict = decision(report.text);
          setPluginStatus(verdict === "KEEP" ? "idle" : "attention", verdict.slice(0, 8), `Drift · ${verdict}`);
        } catch (error) {
          if (generation !== renderGeneration) return;
          output.dataset.state = "error";
          output.textContent = error instanceof Error ? error.message : String(error);
          setPluginStatus("error", "ERR", "Drift report unavailable");
        } finally {
          if (generation === renderGeneration) {
            button.disabled = false;
            select.disabled = false;
            refresh.disabled = false;
          }
        }
      }

      function renderConsole(candidates, truncated) {
        const options = candidates
          .map(({ path }) => `<option value="${escapeHtml(path)}">${escapeHtml(path)}</option>`)
          .join("");
        const note = truncated ? "first 2,000 project entries" : `${candidates.length} likely report${candidates.length === 1 ? "" : "s"}`;
        const body = candidates.length
          ? `<div class="report-head"><span class="path" id="report-path">Select a report</span><span class="count">native validated output</span></div><pre id="report-output" tabindex="0">Choose a report to validate and render.</pre>`
          : `<div class="empty" role="status"><strong>No likely Drift report found</strong><p>Generate a self-contained report in this project. Discovery checks JSON files under <code>.drift/</code> and names containing <code>drift</code> or <code>report</code>.</p><code>drift analyze --model MODEL -o session.drift.json trace.jsonl</code></div>`;
        app.innerHTML = `<header><div><p class="kicker">TRACE / INCIDENT / RECOVERY</p><h1>Drift</h1></div><p class="project">${escapeHtml(context.project.name)} · ${escapeHtml(context.project.id)}</p></header><section class="console"><div class="toolbar"><div class="field"><label for="report-select">Report · ${escapeHtml(note)}</label><select id="report-select" ${candidates.length ? "" : "disabled"}>${options || '<option value="">No candidates</option>'}</select></div><button id="refresh-reports" type="button">Rescan</button><button class="primary" id="render-report" type="button" ${candidates.length ? "" : "disabled"}>Render</button></div>${body}</section>`;
        document.querySelector("#refresh-reports").addEventListener("click", () => discover().catch(fail));
        if (candidates.length) {
          const select = document.querySelector("#report-select");
          document.querySelector("#render-report").addEventListener("click", () => loadReport(select.value));
          select.addEventListener("change", () => loadReport(select.value));
          loadReport(select.value);
        } else {
          setPluginStatus("attention", "EMPTY", `Drift · ${context.project.name}`);
        }
      }

      async function discover() {
        renderGeneration += 1;
        setPluginStatus("busy", null, `Drift · ${context.project.name}`);
        const tree = await call("project.tree", { depth: 6, limit: 2_000 });
        renderConsole(reportCandidates(tree), Array.isArray(tree) && tree.length >= 2_000);
      }

      function fail(error) {
        const message = error instanceof Error ? error.message : String(error);
        app.innerHTML = `<div class="empty" role="alert"><strong>Drift unavailable</strong><p>${escapeHtml(message)}</p></div>`;
        port?.postMessage({
          kind: "event",
          name: "status",
          payload: { state: "error", badge: "ERR", title: "Drift unavailable" },
        });
      }

      function receiveHost(event) {
        if (
          event.source !== window.parent ||
          event.data?.type !== "in-progress:init" ||
          !event.ports[0]
        )
          return;
        const candidate = event.ports[0];
        if (event.data.context?.apiVersion !== API_VERSION) {
          candidate.close();
          fail(new Error(`Expected in-progress plugin API ${API_VERSION}`));
          return;
        }
        window.removeEventListener("message", receiveHost);
        port = candidate;
        context = event.data.context;
        document.documentElement.dataset.mode = context.theme?.mode === "light" ? "light" : "dark";
        port.onmessage = ({ data }) => {
          if (data?.kind !== "response") return;
          const request = pending.get(data.id);
          if (!request) return;
          pending.delete(data.id);
          window.clearTimeout(request.timeout);
          if (data.ok) request.resolve(data.result);
          else request.reject(new Error(typeof data.error === "string" ? data.error : "Host request failed"));
        };
        port.start();
        port.postMessage({ kind: "ready", nonce: event.data.nonce });
        const missing = REQUIRED.filter((capability) => !context.capabilities?.includes(capability));
        if (missing.length) {
          fail(new Error(`Capabilities not granted: ${missing.join(", ")}`));
          return;
        }
        discover().catch(fail);
      }

      window.addEventListener("message", receiveHost);
      window.addEventListener("pagehide", () => {
        for (const request of pending.values()) {
          window.clearTimeout(request.timeout);
          request.reject(new Error("Plugin disposed"));
        }
        pending.clear();
        port?.close();
      });
    </script>
  </body>
</html>
