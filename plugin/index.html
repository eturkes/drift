<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift</title>
    <style>
      @font-face {
        font-family: "Atkinson Hyperlegible Next";
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url("/plugin-theme/atkinson-hyperlegible-next.woff2") format("woff2");
      }

      @font-face {
        font-family: "Iosevka";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/plugin-theme/iosevka.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;
        --ink: var(--host-text, #e7ecf4);
        --muted: var(--host-muted, #909cb0);
        --void: var(--host-background, #0b0e14);
        --panel: var(--host-surface, #121722);
        --panel-raised: var(--host-surface-raised, #18202c);
        --line: var(--host-border, #283142);
        --signal: var(--host-accent, #67d5b5);
        --signal-soft: color-mix(in srgb, var(--signal) 12%, transparent);
        --amber: var(--host-warning, #f2b84b);
        --danger: var(--host-danger, #ff6b78);
        --radius-sm: var(--host-radius-small, 6px);
        --radius-md: var(--host-radius-medium, 10px);
        --radius-lg: var(--host-radius-large, 14px);
        font-family: var(--host-ui-font, "Atkinson Hyperlegible Next", sans-serif);
        background: var(--void);
        color: var(--ink);
      }

      :root[data-mode="light"] {
        color-scheme: light;
        --ink: var(--host-text, #17231f);
        --muted: var(--host-muted, #65736f);
        --void: var(--host-background, #f4f7f6);
        --panel: var(--host-surface, #ffffff);
        --panel-raised: var(--host-surface-raised, #e9efec);
        --line: var(--host-border, #c4d0cc);
        --signal: var(--host-accent, #0b715b);
        --amber: var(--host-warning, #946000);
        --danger: var(--host-danger, #b83245);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(circle at 50% -14%, var(--signal-soft), transparent 32rem),
          var(--void);
      }

      main {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 32px clamp(16px, 4vw, 52px) 64px;
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 24px;
        margin-bottom: 24px;
      }

      .kicker,
      .project,
      .path,
      .count,
      label,
      select,
      button,
      pre,
      .empty code {
        font-family: var(--host-mono-font, "Iosevka", monospace);
      }

      .kicker {
        margin: 0 0 7px;
        color: var(--signal);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 6vw, 56px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .project {
        max-width: 360px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .console {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--panel);
        box-shadow: 0 12px 32px color-mix(in srgb, var(--ink) 8%, transparent);
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: end;
        gap: 10px;
        padding: 15px;
        border-bottom: 1px solid var(--line);
      }

      .analysis-bar,
      .import-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 10px;
        padding: 15px;
        border-bottom: 1px solid var(--line);
        background: var(--signal-soft);
      }

      .analysis-bar button {
        min-width: 132px;
      }

      .import-bar {
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--amber) 10%, var(--panel));
      }

      .import-bar button {
        min-width: 220px;
      }

      .field {
        min-width: 0;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      select,
      button {
        height: 44px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--panel-raised);
        color: var(--ink);
        font-size: 11px;
      }

      select {
        width: 100%;
        padding: 0 10px;
      }

      button {
        min-width: 86px;
        padding: 0 14px;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--signal);
        background: var(--signal);
        color: var(--void);
      }

      button:hover:not(:disabled) {
        border-color: var(--signal);
        background: color-mix(in srgb, var(--panel-raised) 86%, var(--signal));
      }

      button.primary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--signal) 86%, var(--ink));
      }

      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 2px;
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .report-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        padding: 0 15px;
        border-bottom: 1px solid var(--line);
      }

      .path {
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .count {
        flex: 0 0 auto;
        color: var(--signal);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      pre {
        min-height: 420px;
        max-height: 72vh;
        margin: 0;
        padding: clamp(16px, 3vw, 30px);
        overflow: auto;
        color: var(--ink);
        font-size: 12px;
        line-height: 1.62;
        tab-size: 2;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      pre[data-state="loading"] {
        color: var(--muted);
      }

      pre[data-state="error"] {
        color: var(--danger);
      }

      .empty {
        display: grid;
        align-content: center;
        min-height: 420px;
        padding: clamp(20px, 5vw, 54px);
      }

      .empty strong {
        font-size: 26px;
        font-weight: 500;
      }

      .empty p {
        max-width: 650px;
        color: var(--muted);
        line-height: 1.6;
      }

      .empty code {
        display: block;
        max-width: 720px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--panel-raised);
        color: var(--amber);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 70vh;
        color: var(--muted);
      }

      .sweep {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: conic-gradient(from 0deg, var(--signal), transparent 24%);
        animation: sweep 1.3s linear infinite;
      }

      @keyframes sweep {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 660px) {
        main {
          padding-top: 22px;
        }

        header,
        .toolbar,
        .analysis-bar,
        .import-bar {
          grid-template-columns: 1fr;
        }

        .project {
          text-align: left;
        }

        button {
          width: 100%;
        }

        pre {
          max-height: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sweep {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="loading" role="status"><span class="sweep" aria-hidden="true"></span>Scanning for Drift reports and traces…</div>
    </main>

    </script>
    <script type="module">
      const REQUIRED = [
        "project.tree",
        "drift.render",
        "drift.validateTraces",
        "drift.recentSessions",
        "drift.importSession",
        "drift.analyze",
      ];
      const MAX_RENDERED_CHARS = 1_048_576;
      const MAX_TRACE_CANDIDATES = 32;
      const IMPORT_TIMEOUT_MS = 75_000;
      const ANALYZE_TIMEOUT_MS = 21 * 60_000;
      const ANALYSIS_CANCELED = "Drift analysis canceled by the user";
      const IMPORT_CANCELED = "Drift session import canceled by the user";
      const SESSION_ID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
      const app = document.querySelector("#app");
      let client;
      let context;
      let renderGeneration = 0;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function call(method, params, timeoutMs) {
        return client.call(method, params, timeoutMs === undefined ? undefined : { timeoutMs });
      }

      function candidateRank(path) {
        const lower = path.toLowerCase();
        if (!lower.endsWith(".json")) return -1;
        const basename = lower.split("/").at(-1) || "";
        if (basename.endsWith(".schema.json") || lower.includes("/.fingerprint/")) return -1;
        let score = 0;
        if (lower.startsWith(".drift/")) score += 100;
        if (basename.endsWith(".drift.json")) score += 80;
        if (basename.includes("drift")) score += 40;
        if (basename.includes("report")) score += 20;
        if (lower.includes("/reports/")) score += 10;
        return score || -1;
      }

      function treeEntries(value) {
        if (!Array.isArray(value)) throw new Error("project.tree result is not an array");
        return value
          .map((entry) => {
            if (!entry || typeof entry !== "object") {
              throw new Error("project.tree contains an invalid entry");
            }
            if (typeof entry.path !== "string" || entry.path.length < 1 || entry.path.length > 1024) {
              throw new Error("project.tree contains an invalid path");
            }
            return { path: entry.path, kind: entry.kind };
          })
          .filter((entry) => entry.kind === "file");
      }

      function reportCandidates(entries) {
        return entries
          .map((entry) => ({ ...entry, rank: candidateRank(entry.path) }))
          .filter((entry) => entry.rank >= 0)
          .sort((left, right) => right.rank - left.rank || (left.path < right.path ? -1 : left.path > right.path ? 1 : 0));
      }

      function traceRank(path) {
        const lower = path.toLowerCase();
        if (!lower.endsWith(".jsonl")) return -1;
        const basename = lower.split("/").at(-1) || "";
        if (basename.endsWith(".source.jsonl")) return -1;
        let score = 0;
        if (lower.startsWith(".drift/")) score += 100;
        if (basename.endsWith(".drift.jsonl")) score += 80;
        if (basename.includes("trace")) score += 40;
        if (lower.includes("/traces/")) score += 20;
        return score;
      }

      function traceCandidates(entries) {
        return entries
          .map((entry) => ({ ...entry, rank: traceRank(entry.path) }))
          .filter((entry) => entry.rank >= 0)
          .sort((left, right) => right.rank - left.rank || (left.path < right.path ? -1 : left.path > right.path ? 1 : 0));
      }

      function validatedTraceCandidates(value, candidates) {
        if (!value || typeof value !== "object" || Array.isArray(value) || !Array.isArray(value.paths)) {
          throw new Error("drift.validateTraces result is not an object with paths");
        }
        const allowed = new Set(candidates.map(({ path }) => path));
        const valid = new Set();
        for (const path of value.paths) {
          if (typeof path !== "string" || !allowed.has(path) || valid.has(path)) {
            throw new Error("drift.validateTraces returned an invalid path");
          }
          valid.add(path);
        }
        return candidates.filter(({ path }) => valid.has(path));
      }

      function recentCodexSessions(value) {
        if (
          !value ||
          typeof value !== "object" ||
          Array.isArray(value) ||
          !Array.isArray(value.sessions) ||
          value.sessions.length > 20 ||
          typeof value.truncated !== "boolean"
        ) {
          throw new Error("drift.recentSessions returned an invalid result");
        }
        const ids = new Set();
        const sessions = value.sessions.map((session) => {
          if (
            !session ||
            typeof session !== "object" ||
            Array.isArray(session) ||
            typeof session.id !== "string" ||
            !SESSION_ID.test(session.id) ||
            ids.has(session.id) ||
            typeof session.startedAt !== "string" ||
            !Number.isFinite(Date.parse(session.startedAt)) ||
            typeof session.updatedAt !== "string" ||
            !Number.isFinite(Date.parse(session.updatedAt)) ||
            typeof session.source !== "string" ||
            !/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(session.source) ||
            !Number.isSafeInteger(session.byteSize) ||
            session.byteSize < 1 ||
            session.byteSize > 32 * 1024 * 1024
          ) {
            throw new Error("drift.recentSessions returned an invalid session");
          }
          ids.add(session.id);
          return {
            id: session.id,
            startedAt: session.startedAt,
            updatedAt: session.updatedAt,
            source: session.source,
            byteSize: session.byteSize,
          };
        });
        return { sessions, truncated: value.truncated };
      }

      function importedCodexSession(value, expectedId) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new Error("drift.importSession returned an invalid result");
        }
        const expectedPath = `.drift/traces/codex-${expectedId}.drift.jsonl`;
        const parsed = recentCodexSessions({ sessions: [value.session], truncated: false });
        if (value.path !== expectedPath || parsed.sessions[0].id !== expectedId) {
          throw new Error("drift.importSession returned a different session or trace");
        }
        return { path: value.path, session: parsed.sessions[0] };
      }

      function sessionLabel(session) {
        const when = new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(session.startedAt));
        const size = `${(session.byteSize / (1024 * 1024)).toFixed(1)} MiB`;
        return `${when} · ${session.source} · ${size} · …${session.id.slice(-8)}`;
      }

      function renderedReport(value, expectedPath = null) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new Error("drift.render result is not an object");
        }
        if (typeof value.path !== "string" || candidateRank(value.path) < 0) {
          throw new Error("Drift returned an invalid report path");
        }
        if (expectedPath !== null && value.path !== expectedPath) {
          throw new Error("drift.render returned a different path");
        }
        if (
          typeof value.text !== "string" ||
          value.text.length < 1 ||
          value.text.length > MAX_RENDERED_CHARS
        ) {
          throw new Error("drift.render returned invalid or oversized text");
        }
        return { path: value.path, text: value.text };
      }

      function decision(text) {
        return /^(KEEP|RERUN|INSPECT|UNKNOWN)\b/.exec(text)?.[1] || "REPORT";
      }

      function setPluginStatus(state, badge, title) {
        client.setStatus({ state, badge, title: title.slice(0, 80) });
      }

      async function loadReport(path) {
        const generation = ++renderGeneration;
        const output = document.querySelector("#report-output");
        const pathLabel = document.querySelector("#report-path");
        const button = document.querySelector("#render-report");
        const select = document.querySelector("#report-select");
        const refresh = document.querySelector("#refresh-reports");
        const analyze = document.querySelector("#analyze-trace");
        const trace = document.querySelector("#trace-select");
        const importButton = document.querySelector("#import-session");
        const session = document.querySelector("#session-select");
        output.dataset.state = "loading";
        output.textContent = "Validating and rendering native Drift report…";
        pathLabel.textContent = path;
        button.disabled = true;
        select.disabled = true;
        refresh.disabled = true;
        analyze.disabled = true;
        trace.disabled = true;
        importButton.disabled = true;
        session.disabled = true;
        setPluginStatus("busy", null, `Drift · ${context.project.name}`);
        try {
          const report = renderedReport(await call("drift.render", { path }), path);
          if (generation !== renderGeneration) return;
          output.dataset.state = "ready";
          output.textContent = report.text;
          const verdict = decision(report.text);
          setPluginStatus(verdict === "KEEP" ? "idle" : "attention", verdict.slice(0, 8), `Drift · ${verdict}`);
        } catch (error) {
          if (generation !== renderGeneration) return;
          output.dataset.state = "error";
          output.textContent = error instanceof Error ? error.message : String(error);
          setPluginStatus("error", "ERR", "Drift report unavailable");
        } finally {
          if (generation === renderGeneration) {
            button.disabled = false;
            select.disabled = false;
            refresh.disabled = false;
            analyze.disabled = !trace.value;
            trace.disabled = !trace.value;
            importButton.disabled = !session.value;
            session.disabled = !session.value;
          }
        }
      }

      async function analyzeTrace(path) {
        const generation = ++renderGeneration;
        const body = document.querySelector("#report-body");
        const analyze = document.querySelector("#analyze-trace");
        const trace = document.querySelector("#trace-select");
        const reportSelect = document.querySelector("#report-select");
        const render = document.querySelector("#render-report");
        const refresh = document.querySelector("#refresh-reports");
        const importButton = document.querySelector("#import-session");
        const session = document.querySelector("#session-select");
        analyze.disabled = true;
        analyze.textContent = "Analyzing…";
        trace.disabled = true;
        reportSelect.disabled = true;
        render.disabled = true;
        refresh.disabled = true;
        importButton.disabled = true;
        session.disabled = true;
        body.innerHTML = `<div class="empty" role="status"><strong>Analyzing trace…</strong><p>Drift validates the trace before sending it to Codex. Analysis may take up to 20 minutes, including one repair attempt.</p><code>${escapeHtml(path)}</code></div>`;
        setPluginStatus("busy", null, `Drift · ${context.project.name}`);
        try {
          const report = renderedReport(await call("drift.analyze", { path }, ANALYZE_TIMEOUT_MS));
          if (generation !== renderGeneration) return;
          await discover(report.path, report, generation);
        } catch (error) {
          if (generation !== renderGeneration) return;
          const message = error instanceof Error ? error.message : String(error);
          if (message === ANALYSIS_CANCELED) {
            await discover(null, null, generation);
            return;
          }
          body.innerHTML = `<div class="empty" role="alert"><strong>Analysis did not complete</strong><p>${escapeHtml(message)}</p><code>${escapeHtml(path)}</code></div>`;
          setPluginStatus("error", "ERR", "Drift analysis unavailable");
        } finally {
          if (generation === renderGeneration) {
            analyze.disabled = false;
            analyze.textContent = "Analyze trace";
            trace.disabled = false;
            reportSelect.disabled = reportSelect.options.length === 0 || !reportSelect.value;
            render.disabled = reportSelect.disabled;
            refresh.disabled = false;
            importButton.disabled = !session.value;
            session.disabled = !session.value;
          }
        }
      }

      async function importCodexSession(sessionId) {
        const generation = ++renderGeneration;
        const body = document.querySelector("#report-body");
        const importButton = document.querySelector("#import-session");
        const session = document.querySelector("#session-select");
        const analyze = document.querySelector("#analyze-trace");
        const trace = document.querySelector("#trace-select");
        const reportSelect = document.querySelector("#report-select");
        const render = document.querySelector("#render-report");
        const refresh = document.querySelector("#refresh-reports");
        importButton.disabled = true;
        importButton.textContent = "Importing…";
        session.disabled = true;
        analyze.disabled = true;
        trace.disabled = true;
        reportSelect.disabled = true;
        render.disabled = true;
        refresh.disabled = true;
        body.innerHTML = `<div class="empty" role="status"><strong>Importing Codex session…</strong><p>Drift is converting the selected local session into a private project trace. No model or provider is contacted.</p><code>${escapeHtml(sessionId)}</code></div>`;
        setPluginStatus("busy", null, `Drift · ${context.project.name}`);
        try {
          const imported = importedCodexSession(
            await call("drift.importSession", { sessionId }, IMPORT_TIMEOUT_MS),
            sessionId,
          );
          if (generation !== renderGeneration) return;
          await discover(null, null, generation, imported.path);
        } catch (error) {
          if (generation !== renderGeneration) return;
          const message = error instanceof Error ? error.message : String(error);
          if (message === IMPORT_CANCELED) {
            await discover(null, null, generation);
            return;
          }
          body.innerHTML = `<div class="empty" role="alert"><strong>Import did not complete</strong><p>${escapeHtml(message)}</p><code>${escapeHtml(sessionId)}</code></div>`;
          setPluginStatus("error", "ERR", "Drift import unavailable");
        } finally {
          if (generation === renderGeneration) {
            importButton.disabled = false;
            importButton.textContent = "Import recent Codex session";
            session.disabled = false;
            analyze.disabled = !trace.value;
            trace.disabled = !trace.value;
            reportSelect.disabled = !reportSelect.value;
            render.disabled = !reportSelect.value;
            refresh.disabled = false;
          }
        }
      }

      function renderConsole(
        reports,
        traces,
        sessions,
        truncated,
        traceCandidateCount,
        traceValidationTruncated,
        sessionScanTruncated,
        preferredPath = null,
        preferredTracePath = null,
      ) {
        const options = reports
          .map(({ path }) => `<option value="${escapeHtml(path)}" ${path === preferredPath ? "selected" : ""}>${escapeHtml(path)}</option>`)
          .join("");
        const traceOptions = traces
          .map(
            ({ path }) =>
              `<option value="${escapeHtml(path)}" ${path === preferredTracePath ? "selected" : ""}>${escapeHtml(path)}</option>`,
          )
          .join("");
        const sessionOptions = sessions
          .map(
            (session) =>
              `<option value="${escapeHtml(session.id)}">${escapeHtml(sessionLabel(session))}</option>`,
          )
          .join("");
        const note = truncated ? "first 2,000 project entries" : `${reports.length} likely report${reports.length === 1 ? "" : "s"}`;
        const traceNote = `${traces.length} validated trace${traces.length === 1 ? "" : "s"}${truncated || traceValidationTruncated ? " · bounded scan" : ""}`;
        const sessionNote = `${sessions.length} project-matched session${sessions.length === 1 ? "" : "s"}${sessionScanTruncated ? " · bounded scan" : ""} · metadata only`;
        const noTraceCopy = traceCandidateCount
          ? `${Math.min(traceCandidateCount, MAX_TRACE_CANDIDATES)} project JSONL candidate${Math.min(traceCandidateCount, MAX_TRACE_CANDIDATES) === 1 ? " was" : "s were"} checked; none is a native drift.trace/v1 document.${traceValidationTruncated ? " Additional candidates remain outside the validation bound." : ""} Import a recent matching Codex session above or add a native trace, then rescan.`
          : "No project JSONL candidates were found. Import a recent matching Codex session above or add a native drift.trace/v1 document, then rescan.";
        const body = reports.length
          ? `<div class="report-head"><span class="path" id="report-path">Select a report</span><span class="count">native validated output</span></div><pre id="report-output" tabindex="0">Choose a report to validate and render.</pre>`
          : `<div class="empty" role="status"><strong>${traces.length ? "No Drift report yet" : "No valid Drift trace found"}</strong><p>${traces.length ? "Choose an existing Drift trace above. The host validates it, asks before disclosure and local writes, then opens the native report." : noTraceCopy}</p><code>${traces.length ? "drift validate trace.jsonl" : 'drift import codex-exec --task "TASK" -o trace.drift.jsonl run.jsonl'}</code></div>`;
        app.innerHTML = `<header><div><p class="kicker">TRACE / INCIDENT / RECOVERY</p><h1>Drift</h1></div><p class="project">${escapeHtml(context.project.name)} · ${escapeHtml(context.project.id)}</p></header><section class="console"><div class="toolbar"><div class="field"><label for="report-select">Report · ${escapeHtml(note)}</label><select id="report-select" ${reports.length ? "" : "disabled"}>${options || '<option value="">No reports</option>'}</select></div><button id="refresh-reports" type="button">Rescan</button><button class="primary" id="render-report" type="button" ${reports.length ? "" : "disabled"}>Render</button></div><div class="import-bar"><div class="field"><label for="session-select">Recent Codex session · ${escapeHtml(sessionNote)}</label><select id="session-select" ${sessions.length ? "" : "disabled"}>${sessionOptions || '<option value="">No matching sessions</option>'}</select></div><button class="primary" id="import-session" type="button" ${sessions.length ? "" : "disabled"}>Import recent Codex session</button></div><div class="analysis-bar"><div class="field"><label for="trace-select">Drift trace JSONL · ${escapeHtml(traceNote)}</label><select id="trace-select" ${traces.length ? "" : "disabled"}>${traceOptions || '<option value="">No validated traces</option>'}</select></div><button class="primary" id="analyze-trace" type="button" ${traces.length ? "" : "disabled"}>Analyze trace</button></div><div id="report-body">${body}</div></section>`;
        document.querySelector("#refresh-reports").addEventListener("click", () => discover().catch(fail));
        if (sessions.length) {
          const sessionSelect = document.querySelector("#session-select");
          document
            .querySelector("#import-session")
            .addEventListener("click", () => importCodexSession(sessionSelect.value));
        }
        if (traces.length) {
          const traceSelect = document.querySelector("#trace-select");
          document.querySelector("#analyze-trace").addEventListener("click", () => analyzeTrace(traceSelect.value));
        }
        if (reports.length) {
          const select = document.querySelector("#report-select");
          document.querySelector("#render-report").addEventListener("click", () => loadReport(select.value));
          select.addEventListener("change", () => loadReport(select.value));
          loadReport(select.value);
        } else {
          setPluginStatus("attention", "EMPTY", `Drift · ${context.project.name}`);
        }
      }

      async function discover(
        preferredPath = null,
        fallbackReport = null,
        generation = null,
        preferredTracePath = null,
      ) {
        if (generation === null) renderGeneration += 1;
        else if (generation !== renderGeneration) return;
        setPluginStatus("busy", null, `Drift · ${context.project.name}`);
        const [tree, recentValue] = await Promise.all([
          call("project.tree", { depth: 6, limit: 2_000 }),
          call("drift.recentSessions"),
        ]);
        if (generation !== null && generation !== renderGeneration) return;
        const recent = recentCodexSessions(recentValue);
        const entries = treeEntries(tree);
        const reports = reportCandidates(entries);
        const candidates = traceCandidates(entries);
        if (
          preferredTracePath &&
          traceRank(preferredTracePath) >= 0 &&
          !candidates.some(({ path }) => path === preferredTracePath)
        ) {
          candidates.unshift({ path: preferredTracePath, kind: "file", rank: traceRank(preferredTracePath) });
        }
        const boundedCandidates = candidates.slice(0, MAX_TRACE_CANDIDATES);
        const traces = boundedCandidates.length
          ? validatedTraceCandidates(
              await call("drift.validateTraces", {
                paths: boundedCandidates.map(({ path }) => path),
              }),
              boundedCandidates,
            )
          : [];
        if (generation !== null && generation !== renderGeneration) return;
        if (fallbackReport && !reports.some(({ path }) => path === fallbackReport.path)) {
          reports.unshift({ path: fallbackReport.path, kind: "file", rank: candidateRank(fallbackReport.path) });
        }
        renderConsole(
          reports,
          traces,
          recent.sessions,
          Array.isArray(tree) && tree.length >= 2_000,
          candidates.length,
          candidates.length > boundedCandidates.length,
          recent.truncated,
          preferredPath,
          preferredTracePath,
        );
      }

      function fail(error) {
        const message = error instanceof Error ? error.message : String(error);
        app.innerHTML = `<div class="empty" role="alert"><strong>Drift unavailable</strong><p>${escapeHtml(message)}</p></div>`;
        client?.setStatus({ state: "error", badge: "ERR", title: "Drift unavailable" });
      }

      async function start() {
        client = await globalThis.InProgressProtocol.connectInProgress({
          requiredCapabilities: REQUIRED,
        });
        context = client.context;
        document.documentElement.dataset.mode = context.theme.mode;
        await discover();
      }

      start().catch(fail);
    </script>
  </body>
</html>
